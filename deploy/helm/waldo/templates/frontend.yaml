apiVersion: apps/v1
kind: Deployment
metadata:
  name: waldo-frontend
  labels:
    app.kubernetes.io/name: waldo-frontend
    app.kubernetes.io/part-of: waldo
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: waldo-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waldo-frontend
        app.kubernetes.io/part-of: waldo
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.registry }}/waldo-frontend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: waldo-frontend
  labels:
    app.kubernetes.io/name: waldo-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: waldo-frontend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: {{ .Values.frontend.nodePort }}
