kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: waldo
nodes:
  - role: control-plane
    extraPortMappings:
      # Frontend NodePort, reachable on the Mac (and over Tailscale) at :8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "0.0.0.0"
        protocol: TCP
